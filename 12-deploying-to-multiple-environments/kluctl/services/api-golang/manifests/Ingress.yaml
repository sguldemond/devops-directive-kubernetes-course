apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-golang
  namespace: demo-app
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: demo-app-strip-api-prefixes@kubernetescrd
spec:
  rules:
    - host: {{ sharedVars.hostName }}
      http:
        paths:
          - path: /api/golang
            pathType: Prefix
            backend:
              service:
                name: api-golang
                port:
                  number: 8000
