version: "3"

vars:
  DATABASE_URL: "postgres://postgres:foobarbaz@localhost:5432/postgres"
  REGISTRY_URL: macmini.home
  IMAGE_REPO: /sidpalas/devops-directive-docker-course-api-golang
  IMAGE_TAG: foobarbaz

tasks:
  install:
    desc: "download dependencies"
    cmds:
      - go mod tidy

  run:
    desc: "download dependencies"
    cmds:
      - echo $PWD
      - ls
      - DATABASE_URL={{.DATABASE_URL}} go run main.go

  build-container-image:
    desc: Build container image
    cmds:
      # - |
      #   KO_DOCKER_REPO='{{.IMAGE_REPO}}' \
      #     ko build \
      #     --bare \
      #     --tags={{.IMAGE_TAG}} \
      #     --platform=all
      - docker build -t {{.REGISTRY_URL}}{{.IMAGE_REPO}}:{{.IMAGE_TAG}} .
      - docker push {{.REGISTRY_URL}}{{.IMAGE_REPO}}:{{.IMAGE_TAG}}

  build-container-image-multi-arch:
    desc: Build multi-arch container image
    cmds:
      - task: build-container-image
